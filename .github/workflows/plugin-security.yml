name: Plugin Security Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        product: [opencode, kilo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Stage the shipped native plugin
        run: go run ./internal/cmd/stage-native-plugin -repo . -product "${{ matrix.product }}" -output ".scan/${{ matrix.product }}"
      - uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: ".scan/${{ matrix.product }}"
          min_score: 80
          fail_on_severity: high
          online: "false"
          upload_sarif: "false"
          pr_comment: "off"
          submission_enabled: "false"
          trust_repository_policy: "false"
