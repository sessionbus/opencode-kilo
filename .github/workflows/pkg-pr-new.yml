name: Package checks and scoped previews

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify both native package boundaries
        run: |
          for PRODUCT in opencode kilo; do
          export PRODUCT
          (
          cd "$PRODUCT"
          npm ci --ignore-scripts
          npm test
          go run ../internal/cmd/stage-native-plugin -repo .. -product "$PRODUCT" -output "$RUNNER_TEMP/native-plugin/$PRODUCT"
          cd "$RUNNER_TEMP/native-plugin/$PRODUCT"
          npm pack --dry-run --json > /tmp/sessionbus-native-pack.json
          node - <<'NODE'
          const report = require('/tmp/sessionbus-native-pack.json')[0]
          const got = report.files.map((file) => file.path).sort()
          const want = [
            'README.md',
            'activation.mjs',
            'delivery.mjs',
            'endpoint.mjs',
            'forward.mjs',
            'gate.mjs',
            'owners.mjs',
            'package.json',
            'peer.mjs',
            'profile.mjs',
            'readiness.mjs',
            'server.mjs',
            'sessionbus-tool.json',
            'skills/sessionbus/SKILL.md',
            'tui.mjs',
          ].sort()
          if (JSON.stringify(got) !== JSON.stringify(want)) {
            throw new Error(`unexpected native plugin pack files: ${JSON.stringify(got)}`)
          }
          const manifest = require('./package.json')
          if (manifest.repository?.url !== 'git+https://github.com/sessionbus/opencode-kilo.git' ||
              manifest.repository?.directory !== process.env.PRODUCT) {
            throw new Error('Native plugin repository metadata is invalid')
          }
          NODE
          )
          done
      # pkg-pr-new consumes one registration per workflow, including matrix jobs.
      - run: npx --yes pkg-pr-new publish "$RUNNER_TEMP/native-plugin/opencode" "$RUNNER_TEMP/native-plugin/kilo"
